[theme]
base = "dark"
primaryColor = "#1a82d4"
backgroundColor = "#0d1b2a"
secondaryBackgroundColor = "#13263a"
textColor = "#e8f1f8"
linkColor = "#6cb8f5"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
headingFontWeights = [800, 700, 700]
borderColor = "#22395a"
baseRadius = "0.7rem"
buttonRadius = "0.7rem"
showWidgetBorder = true
showSidebarBorder = true
chartCategoricalColors = ["#1a82d4", "#ff9f43", "#3ddc97", "#a78bfa", "#ef476f"]

[theme.sidebar]
backgroundColor = "#0a1622"
secondaryBackgroundColor = "#13263a"
borderColor = "#1a2e48"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
